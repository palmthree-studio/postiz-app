---
name: "li3: build patched image"

# Push-triggered: workflow_dispatch only works for workflows on the default branch.
on:
  push:
    branches:
      - li3
      - 'li3-*'

env:
  # Upstream tag the branch is based on; bump it on each rebase.
  BASE_TAG: v2.25.1

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check scopes patch
        run: |
          grep -q "scopes = \['openid', 'profile', 'w_member_social'\];" \
            libraries/nestjs-libraries/src/integrations/social/linkedin.provider.ts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/postiz-app:${{ env.BASE_TAG }}-li3
        run: |
          docker buildx build --platform linux/amd64 \
            -f Dockerfile.dev \
            --build-arg NEXT_PUBLIC_VERSION=${{ env.BASE_TAG }}-li3 \
            --pull --provenance=false --sbom=false \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --output "type=registry,name=${IMAGE}" .
